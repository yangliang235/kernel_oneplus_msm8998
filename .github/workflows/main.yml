name: Build OnePlus 5 Kernel (GCC11, F2FS, Swappiness=200)

on:
  push:
    branches: [ "r11.1" ]
  pull_request:
    branches: [ "r11.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4  # 顺便也更新 checkout 版本
      with:
        fetch-depth: 1

    - name: Install Dependencies & GCC 11 Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip curl git
        sudo apt-get install -y gcc-11-aarch64-linux-gnu binutils-aarch64-linux-gnu
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-11 /usr/bin/aarch64-linux-gnu-gcc

    - name: Patch Kernel Source (swappiness=200)
      run: |
        echo "=== 1. 修改 MAX_SWAPPINESS 宏 ==="
        grep -rl "define MAX_SWAPPINESS 100" . | xargs -r sed -i 's/define MAX_SWAPPINESS 100/define MAX_SWAPPINESS 200/g'

        echo "=== 2. 修改 sysctl.c ==="
        sed -i 's/static int one_hundred = 100;/static int one_hundred = 100;\nstatic int two_hundred = 200;/g' kernel/sysctl.c
        sed -i '/.procname\s*=\s*"swappiness"/,/},/ s/\.extra2\s*=\s*&one_hundred,/.extra2     = \&two_hundred,/g' kernel/sysctl.c
        
        echo "验证 sysctl.c 修改："
        grep -A 6 'procname.*"swappiness"' kernel/sysctl.c

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        if [ -f "arch/arm64/configs/lineage_oneplus5_defconfig" ]; then
          make lineage_oneplus5_defconfig
        else
          make msm-perf_defconfig
        fi
        
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE}

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
        cd AnyKernel3
        cp ../arch/arm64/boot/Image.gz-dtb .
        
        cat << 'EOF' >> anykernel.sh

        ui_print("Applying swappiness=200 settings...");
        if [ -f /system/etc/sysctl.conf ]; then
            echo "vm.swappiness=200" >> /system/etc/sysctl.conf
        else
            mkdir -p /system/etc
            echo "vm.swappiness=200" > /system/etc/sysctl.conf
        fi
        echo 200 > /proc/sys/vm/swappiness 2>/dev/null
        ui_print("Swappiness set to 200 successfully!");
        EOF
        
        zip -r9 ../OnePlus5_Kernel_GCC11_F2FS_Swap200.zip * -x .git README.md *placeholder

    # 关键修复：将 v3 升级为 v4
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4  # <--- 修改此处
      with:
        name: OnePlus5_Kernel_Swap200
        path: OnePlus5_Kernel_GCC11_F2FS_Swap200.zip
